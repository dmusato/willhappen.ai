name: "Suggest a question"
description: "Something the machine should be watching but isn't."
title: "Suggest: "
labels: ["suggestion", "community"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are harvested automatically from prediction markets and the news, so the
        archive skews toward what those cover. This is how you widen it.

        A good one is a **single statement that will be plainly true or plainly false by a
        known date**. "AI gets scary good" is not one. "A frontier lab publicly delays a
        model release citing safety evaluations, before July 2027" is.
  - type: textarea
    id: headline
    attributes:
      label: The statement
      description: One sentence, stating the thing that would happen. Not a question.
      placeholder: "A major studio releases a feature film generated entirely by AI before the end of 2027."
    validations:
      required: true
  - type: dropdown
    id: horizon
    attributes:
      label: By when
      options: ["1 week", "1 month", "3 months", "6 months", "1 year", "3 years", "5 years", "10 years", "50 years"]
    validations:
      required: true
  - type: input
    id: resolution
    attributes:
      label: What would count as it happening?
      description: The clearer this is, the better the auto-resolver will do later.
      placeholder: "Wide theatrical release, credited as fully AI-generated by the studio itself."
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: Why now?
      description: A link to what makes this live — reporting, a market, a filing.
    validations:
      required: false
