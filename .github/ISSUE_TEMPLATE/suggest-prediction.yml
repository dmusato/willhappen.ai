name: "Suggest a prediction"
description: "Propose a question for the six-model consensus to evaluate."
title: "Suggest: "
labels: ["suggestion", "community"]
body:
  - type: textarea
    id: headline
    attributes:
      label: The prediction
      description: One short, falsifiable sentence. Yes/no questions work best.
      placeholder: "By the end of 2027, a major studio will release a film entirely generated by AI."
    validations:
      required: true
  - type: dropdown
    id: horizon
    attributes:
      label: Time horizon
      options:
        - 1 week
        - 1 month
        - 6 months
        - 1 year
        - 3 years
        - 5 years
        - 10 years
        - 50 years
        - 100 years
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic (optional)
      options:
        - AI
        - Climate
        - Geopolitics
        - Markets
        - Space
        - Health
        - Energy
        - Crypto
        - Tech
        - Culture
        - Science
        - Biotech
        - Robotics
        - Transport
        - Education
        - Labor
        - Demographics
        - Security
        - Sports
        - Gaming
        - Art
        - Food
        - Web3
        - Privacy
        - Policy
        - Nature
        - Oceans
        - Housing
        - Mobility
        - Longevity
  - type: textarea
    id: rationale
    attributes:
      label: Why this one?
      description: Optional context — signals, sources, why it's interesting.
